name: Validate Reader foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository foundation
        run: node scripts/validate-foundation.mjs
      - name: Validate privacy boundary
        run: node scripts/validate-privacy-boundary.mjs
      - name: Validate truthful platform status
        run: |
          grep -q "lifecycle: development" goreecloud.platform.yaml
          grep -q "status: nonconformant" goreecloud.platform.yaml
          grep -q "license: AGPL-3.0-or-later" goreecloud.platform.yaml

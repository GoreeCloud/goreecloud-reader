name: Validate Reader foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository foundation
        run: node scripts/validate-foundation.mjs
      - name: Validate privacy boundary
        run: node scripts/validate-privacy-boundary.mjs
      - name: Validate truthful platform status
        run: |
          grep -q "lifecycle: development" goreecloud.platform.yaml
          grep -q "status: nonconformant" goreecloud.platform.yaml
          grep -q "license: AGPL-3.0-or-later" goreecloud.platform.yaml

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - name: Bootstrap verified Gradle wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh
      - name: Build Android debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify Android debug APK
        run: test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android debug build evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-reader-android-debug-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

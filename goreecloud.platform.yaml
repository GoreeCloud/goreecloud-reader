schema_version: '0.2'
component:
  type: application
  id: goreecloud-reader
  product_name: GoreeCloud Reader
  repository: GoreeCloud/goreecloud-reader
lifecycle: development
version: '0.0.4-foundation'
supported_platforms:
- web
- android
api:
  versions: []
  endpoints: []
platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    notes: Administrative and operational Reader integration is required but not implemented.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
    - privacy/privacy-shield.application-manifest.json
    - scripts/validate-privacy-boundary.mjs
    - docs/PRIVACY.md
    - PRIVACY POLICY.md
    notes: Source manifest is intentionally fail-closed with no declared purposes or resources. Runtime authorization and acceptance are required before real personal-media processing.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
    - SECURITY.md
    notes: Security controls and Wardveil runtime acceptance remain required before real media operations or production use.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    - FEATURE-ROADMAP.md
    notes: Backup, restore, preservation, portability, and recovery verification are planned but not implemented.
  glaze_ui:
    result: applicable-migration-required
    version: '1.3.0'
    evidence:
    - contracts/glaze-ui/reader-glaze-v1.3.json
    - contracts/glaze-ui/reader-glaze-v1.5.1-stable.json
    - scripts/validate-glaze-adoption.mjs
    - scripts/validate-glaze-v1.5.1-stable.mjs
    - docs/GLAZE-UI-ADOPTION.md
    - apps/web/app.css
    - apps/web/tests/glaze-rendered.spec.mjs
    - apps/web/TESTING.md
    - apps/android/app/src/main/java/com/goreecloud/reader/MainActivity.kt
    notes: Reader still implements the verified GLAZE UI V1.3 / 1.3.0 foundation mapping. Current Stable GLAZE UI V1.5 / 1.5.1 at exact source revision 98da57064ede0f334627b632bc16801f580331af is the required compatibility target. Repository-local V1.5.1 compatibility evidence does not establish substantive source migration, application-specific acceptance, manual accessibility, Android physical-device, rollback, release, or production acceptance.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    notes: No runtime Mesh capabilities or events are implemented.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
    - SPECIFICATIONS.md
    - SECURITY.md
    notes: Account, profile, authorization, session, and device integration are planned but absent from the foundation.
health:
  health_endpoint: null
  readiness_endpoint: null
continuity:
  backup:
    required: true
    requirements:
    - Define accepted Everkeep protection before durable Reader state becomes production-dependent.
  restore:
    required: true
    requirements:
    - Verify restoration, integrity, authorization, and privacy lifecycle behavior before recovery-ready claims.
  export:
    required: true
    requirements:
    - Provide user-controlled portable export for supported Reader metadata, progress, annotations, and configuration.
  portability:
    required: true
    requirements:
    - Preserve original media and understandable portable metadata/state formats wherever practical.
external_dependencies:
- name: Gradle
  purpose: Build the Android development application and execute repository build tasks.
  required: true
  version_constraint: '==8.11.1'
- name: Android Gradle Plugin
  purpose: Provide Android build tooling for the Reader Android foundation.
  required: true
  version_constraint: '==8.10.1'
- name: Playwright Test
  purpose: Run repository-owned synthetic rendered-web verification across supported browser engines during development validation.
  required: false
  version_constraint: '==1.63.0'
- name: axe-core
  purpose: Perform automated accessibility checks within the synthetic rendered-web verification harness.
  required: false
  version_constraint: '==4.13.0'
compatibility:
  platform_contract: '0.2'
  glaze_ui_required: '1.5.1'
  requires:
  - goreecloud-platform-contract==0.2
  - glaze-ui==1.5.1
  provides:
  - goreecloud-reader-web-foundation
  - goreecloud-reader-android-foundation
evidence:
  acceptance_tests: []
  release: []
conformance:
  status: nonconformant
  validated_at: null
  evidence:
  - README.md
  - FEATURES.md
  - docs/ARCHITECTURE.md
  - docs/ANDROID-BUILD.md
  - contracts/glaze-ui/reader-glaze-v1.3.json
  - contracts/glaze-ui/reader-glaze-v1.5.1-stable.json
  - scripts/validate-glaze-adoption.mjs
  - scripts/validate-glaze-v1.5.1-stable.mjs
  - docs/GLAZE-UI-ADOPTION.md
  - apps/web/tests/glaze-rendered.spec.mjs
  - docs/PRIVACY.md
  - privacy/privacy-shield.application-manifest.json
  blockers:
  - Real personal-library ingestion, persistence, reading, and audiobook playback are not implemented.
  - Runtime Privacy Shield, Wardveil Security, Everkeep, GoreeCloud Identity, GoreeCloud Mesh, GoreeCloud Sync, and GoreeCloud Manager integrations are incomplete.
  - Current Stable Glaze UI 1.5.1 substantive source migration and consumer acceptance are not established.
  - GoreeCloud Sync remains a separately governed application/service capability; no accepted Reader Sync dataset contract or runtime reconciliation evidence is established.
  - Manual assistive-technology, Android physical-device, rollback, and production acceptance are incomplete.
  - Production deployment, recovery acceptance, and exact release evidence are incomplete.

# GoreeCloud Sync remains a separately governed application/service capability and is
# intentionally not represented as an eighth key under platform_systems.
